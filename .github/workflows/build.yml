name: NexaBuild Pipeline

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'JSON Configuration'
        required: true
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3

      - name: Generate project
        run: |
          echo '${{ github.event.inputs.config }}' > config.json
          export NEXA_CONFIG=config.json
          python3 tools/generate.py

      - name: Build APK
        run: |
          echo "Building APK..."
          # Dummy build step for template verification
          mkdir -p output
          echo "NexaBuild APK Artifact" > output/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: output/*.apk
